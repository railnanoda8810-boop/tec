<script>
"use strict";
const slides=[{"chapter":"導入","short":"表紙","title":"AIで作る前に、<em>進め方</em>を学ぼう。","lead":"コードの書き方ではなく、何を作り、どう確かめ、どう改善するか。47の方法を一から理解するプレゼンです。","content":"\n<div class=\"hero-figure\"><div class=\"halo\"></div><div class=\"float-tile t1\"><span>01</span><b>作る</b></div><div class=\"float-tile t2\"><span>02</span><b>試す</b></div><div class=\"float-tile t3\"><span>03</span><b>直す</b></div><div class=\"float-core\"><span>AI × YOU</span><strong>「完成」を<br>目指す</strong></div></div>\n<div class=\"intro-bottom\"><span class=\"kbd\">→</span> 右矢印または「次へ」で進む　／　<span class=\"kbd\">O</span> 全体の目次</div>","layout":"hero-slide","note":"まず全体像をつかもう。用語の暗記はあとでよい。","sources":[]},{"chapter":"導入","short":"開発とは","title":"開発とは、何をすること？","lead":"AIがコードを作っただけでは、まだ目的が達成されたとはいえません。","content":"\n<div class=\"cols3\"><div class=\"explain-card \"><div class=\"piece-key\">01</div><strong>問題を決める</strong><p>誰の、どんな不便を解消する？</p></div><div class=\"explain-card \"><div class=\"piece-key\">02</div><strong>使える形にする</strong><p>小さくても、実際に動くものを作る。</p></div><div class=\"explain-card \"><div class=\"piece-key\">03</div><strong>結果を確かめる</strong><p>自分の目で「できた」を確認する。</p></div></div>\n<div class=\"wide-takeaway fragment\" data-step=\"1\"><b>覚えること</b><span>書いたコードの量より、<strong>解決できた問題</strong>が重要。</span></div>","layout":"","note":"この先に出てくる全ての手法は、この3つをどう進めるかの工夫。","sources":[]},{"chapter":"導入","short":"完成の定義","title":"「完成」を先に決めよう。","lead":"「アプリを作って」より「どんな操作をしたら、何が起こるか」を具体的に。","content":"\n<div class=\"compare\"><div class=\"compare-side bad\"><div class=\"eyebrow\">曖昧な目標</div><h3>すごい録音アプリを作る</h3><p>どこまで必要？　どの機能が完成？</p></div><div class=\"compare-side good fragment\" data-step=\"1\"><div class=\"eyebrow\">確認できる目標</div><h3>録音ボタン→音声ファイルが保存される</h3><p>ボタン、保存先、再生結果を確認できる。</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"2\">完成条件 = <b>利用者が見て確かめられる結果</b></div>","layout":"","note":"","sources":[]},{"chapter":"導入","short":"活動・成果・効果","title":"「がんばった」と「役に立った」は違う。","lead":"AIが何時間動いたか、何回修正したかだけでは評価できません。","content":"\n<div class=\"metric-row\"><div class=\"explain-card \"><div class=\"piece-key\">ACTIVITY</div><strong>活動</strong><p>AIが100回コードを編集した</p></div><div class=\"explain-card \"><div class=\"piece-key\">OUTPUT</div><strong>成果物</strong><p>録音機能が作られた</p></div><div class=\"explain-card \"><div class=\"piece-key\">OUTCOME</div><strong>効果</strong><p>実際に毎日録音できる</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\">最終的に重視するのは<strong>Outcome（実際の効果）</strong>。ただし、途中の成果や検証も必要。</div>","layout":"","note":"","sources":[]},{"chapter":"基本の4手法","short":"イテレーティブ","title":"① イテレーティブ","lead":"Iterative = <strong>同じものを繰り返し改善する</strong>こと。","content":"\n<div class=\"sequence\"><div class=\"quality-stage \" ><span class=\"stage-round\">01</span><div class=\"motion-line\"><svg viewBox=\"0 0 250 65\" preserveAspectRatio=\"none\"><path d=\"M0 37 L35 18 L52 50 L81 16 L120 51 L147 13 L188 52 L214 12 L250 38\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg></div><strong>初回</strong><small>形にする</small></div><div class=\"arr\">→</div><div class=\"quality-stage fragment\" data-step=\"1\"><span class=\"stage-round\">02</span><div class=\"motion-line\"><svg viewBox=\"0 0 250 65\" preserveAspectRatio=\"none\"><path d=\"M0 39 Q30 12 62 39 T124 39 T186 39 T250 39\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg></div><strong>2回目</strong><small>動きを調整</small></div><div class=\"arr\">→</div><div class=\"quality-stage fragment\" data-step=\"2\"><span class=\"stage-round\">03</span><div class=\"motion-line\"><svg viewBox=\"0 0 250 65\" preserveAspectRatio=\"none\"><path d=\"M0 37 Q62 25 125 37 T250 37\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg></div><strong>3回目</strong><small>自然さを改善</small></div></div>\n<div class=\"takeaway fragment\" data-step=\"3\">ポイント：<strong>新機能が増えなくても</strong>、同じものを良くしている。</div>","layout":"","note":"例：AutoRigの髪の揺れを、動画で比較して改善する。","sources":[]},{"chapter":"基本の4手法","short":"インクリメンタル","title":"② インクリメンタル","lead":"Incremental = <strong>使える機能を少しずつ増やす</strong>こと。","content":"\n<div class=\"build-stack\"><div class=\"build-block b1\"><span>機能 01</span><strong>録音する</strong></div><div class=\"build-block b2 fragment\" data-step=\"1\"><span>機能 02</span><strong>保存する</strong></div><div class=\"build-block b3 fragment\" data-step=\"2\"><span>機能 03</span><strong>検索する</strong></div></div>\n<div class=\"takeaway fragment\" data-step=\"3\">ポイント：<strong>毎段階で使えるものを増やす</strong>。単に途中の部品を大量に作ることではない。</div>","layout":"","note":"録音はV1、保存はV2、検索はV3。各段階で利用可能な成果物がある。","sources":[]},{"chapter":"基本の4手法","short":"違いの確認","title":"「直す」か、「増やす」か。","lead":"この2つは似ているけれど、見ている方向が違います。","content":"\n<div class=\"compare\"><div class=\"compare-side blue\"><span class=\"eyebrow\">ITERATIVE</span><h3>品質を上げる</h3><div class=\"visual-bars\"><span style=\"width:27%\"></span><span style=\"width:60%\"></span><span style=\"width:98%\"></span></div><p>同じ録音機能を改善。雑音への強さや使いやすさが上がる。</p></div><div class=\"compare-side green\"><span class=\"eyebrow\">INCREMENTAL</span><h3>機能を増やす</h3><div class=\"visual-build\"><span>録音</span><span>保存</span><span>検索</span></div><p>録音できる状態から、保存と検索を追加する。</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\">どちらか一方だけではなく、<strong>両方組み合わせられる</strong>。</div>","layout":"","note":"","sources":[]},{"chapter":"基本の4手法","short":"組み合わせ","title":"おすすめは、<em>小さく増やして、直す。</em>","lead":"イテレーティブとインクリメンタルを一緒に使うと、迷子になりにくい。","content":"\n<div class=\"journey\"><div class=\"journey-row\"><span>V1</span><span class=\"tag soft\">録音を作る</span><b>→</b><span class=\"tag blue\">録音を改善</span></div><div class=\"journey-row fragment\" data-step=\"1\"><span>V2</span><span class=\"tag soft\">保存を追加</span><b>→</b><span class=\"tag blue\">保存を改善</span></div><div class=\"journey-row fragment\" data-step=\"2\"><span>V3</span><span class=\"tag soft\">検索を追加</span><b>→</b><span class=\"tag blue\">検索を改善</span></div></div>\n<div class=\"takeaway fragment\" data-step=\"3\">増やす = <b>Incremental</b>　／　直す = <b>Iterative</b></div>","layout":"","note":"「機能追加」と「改善」を小刻みに往復する。","sources":[]},{"chapter":"基本の4手法","short":"初心者への使い方","title":"初心者ほど、最初の一歩を小さく。","lead":"知識が少ないときは、長大な設計書を作るより、分からないことを小さく確かめる価値が大きい。","content":"\n<div class=\"rail-wrap\"><div class=\"rail \"><div class=\"rail-unit \"><div class=\"rail-num\">01</div><strong>1つに絞る</strong><span>まず何が動けばいい？</span></div><div class=\"rail-unit \"><div class=\"rail-num\">02</div><strong>作って試す</strong><span>本物の結果を見る</span></div><div class=\"rail-unit \"><div class=\"rail-num\">03</div><strong>理由を理解</strong><span>なぜ動いた？ なぜ失敗？</span></div><div class=\"rail-unit last\"><div class=\"rail-num\">04</div><strong>次を足す</strong><span>新しい機能を1つだけ</span></div></div></div>\n<div class=\"wide-takeaway fragment\" data-step=\"1\"><b>注意点</b><span>ただし<strong>認証・プライバシー・安全性</strong>のように、最初から考慮すべき設計もあります。</span></div>","layout":"","note":"","sources":[]},{"chapter":"基本の4手法","short":"牛尾剛さんの例","title":"牛尾剛さんの実践から学ぶ。","lead":"本人は2026年10月の記事で、荒いものから作る反復的・増分的なスタイルを説明しています。","content":"\n<div class=\"quote-layout\"><div class=\"quote-mark\">“</div><div><h3>理解する対象を変える</h3><p>AIに実装とテストを任せる一方、構造・外から見える動作・実際の操作感を確かめる。</p><p class=\"fragment\" data-step=\"1\">重要な部分はコードも確認し、必要なら実行可能な小さな教材で仕組みを理解する。</p><a class=\"source-link\" href=\"https://note.com/simplearchitect/n/n8339c9eac8cb\" target=\"_blank\" rel=\"noopener noreferrer\">本人の記事『理解の対象を変えた話』を読む ↗</a></div></div>\n<div class=\"takeaway fragment\" data-step=\"2\"><strong>「AIに任せた＝理解しなくてよい」ではない。</strong> 何を理解するかを選ぶ。</div>","layout":"","note":"","sources":["https://note.com/simplearchitect/n/n8339c9eac8cb"]},{"chapter":"基本の4手法","short":"アジャイル","title":"③ アジャイルは<em>考え方</em>。","lead":"Agileは固定の作業手順ではありません。変化に対応しながら、価値を届けるための原則です。","content":"\n<div class=\"value-grid\"><div class=\"explain-card \"><div class=\"piece-key\">01</div><strong>会話を大切に</strong><p>手順や道具だけでなく、理解をすり合わせる。</p></div><div class=\"explain-card \"><div class=\"piece-key\">02</div><strong>動くものを重視</strong><p>説明書だけで終わらせない。</p></div><div class=\"explain-card \"><div class=\"piece-key\">03</div><strong>相手と協力</strong><p>利用者の困りごとを確認する。</p></div><div class=\"explain-card \"><div class=\"piece-key\">04</div><strong>変化に対応</strong><p>計画どおりでなくても学びを反映する。</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\">「計画が不要」という意味ではない。<strong>計画を見直せること</strong>が大切。</div>","layout":"","note":"","sources":["https://agilemanifesto.org/iso/ja/manifesto.html"]},{"chapter":"基本の4手法","short":"ウォーターフォール","title":"④ ウォーターフォール","lead":"Waterfall = 先に大きく設計し、工程を順に進める方法。","content":"\n<div class=\"rail \"><div class=\"rail-unit \"><div class=\"rail-num\">01</div><strong>要件</strong><span>何が必要？</span></div><div class=\"rail-unit \"><div class=\"rail-num\">02</div><strong>設計</strong><span>どう作る？</span></div><div class=\"rail-unit \"><div class=\"rail-num\">03</div><strong>実装</strong><span>コードを作る</span></div><div class=\"rail-unit \"><div class=\"rail-num\">04</div><strong>テスト</strong><span>正しさを確認</span></div><div class=\"rail-unit last\"><div class=\"rail-num\">05</div><strong>公開</strong><span>利用できる状態に</span></div></div>\n<div class=\"compare mini\"><div class=\"compare-side good\"><h3>向いている</h3><p>要件が安定し、手続きや確認が明確な仕事。</p></div><div class=\"compare-side bad fragment\" data-step=\"1\"><h3>苦手になりやすい</h3><p>途中で必要なものが大幅に変わる仕事。</p></div></div>","layout":"","note":"順番を重視するが、実装中にテストを一切しないという意味ではない。","sources":[]},{"chapter":"基本の4手法","short":"どう選ぶ","title":"仕事に合う方法を選ぶ。","lead":"最初から設計を決めるべき部分と、試して学ぶ部分は違います。","content":"\n<div class=\"axis-frame\"><div class=\"axis-title\">試してみないと分からない度合い ↑</div><div class=\"axis-grid\"><div class=\"axis-cell\"><strong>試作・PoC</strong><span>技術が未知、要件は比較的明確</span></div><div class=\"axis-cell accent\"><strong>Iterative ＋ Agile</strong><span>技術も要望もよく変わる</span></div><div class=\"axis-cell\"><strong>設計先行</strong><span>技術も要件も安定</span></div><div class=\"axis-cell\"><strong>Incremental</strong><span>機能を少しずつ増やす</span></div></div><div class=\"axis-bottom\">← 要件が安定　　要件が変わりやすい →</div></div>\n<div class=\"takeaway fragment\" data-step=\"1\">これは<strong>選択の目安</strong>。1つのプロジェクトでも部分ごとに使い分ける。</div>","layout":"","note":"","sources":[]},{"chapter":"管理と探索","short":"スクラム","title":"スクラム：短い周期で成果を見る。","lead":"Scrumはチーム向けの公式フレームワーク。期間を区切り、確認と改善を続けます。","content":"\n<div class=\"cycle\"><div class=\"cycle-node\">目標を決める</div><div class=\"cycle-arrow\">→</div><div class=\"cycle-node\">作る・確かめる</div><div class=\"cycle-arrow\">→</div><div class=\"cycle-node\">成果を見せる</div><div class=\"cycle-arrow\">↻</div></div>\n<div class=\"cols2\"><div class=\"explain-card\"><div class=\"piece-key\">SPRINT</div><strong>1か月以内の固定期間</strong><p>期間内で使える成果を目指す。</p></div><div class=\"explain-card fragment\" data-step=\"1\"><div class=\"piece-key\">注意</div><strong>個人開発は一部を参考に</strong><p>正式なスクラムと、個人の週次振り返りは同じではない。</p></div></div>","layout":"","note":"","sources":["https://scrumguides.org/scrum-guide.html"]},{"chapter":"管理と探索","short":"カンバン","title":"カンバン：仕事の詰まりを見つける。","lead":"Kanbanでは作業状態を可視化し、進行中の仕事が増えすぎるのを防ぎます。","content":"\n<div class=\"board\"><div class=\"board-col\"><header>未着手 <span>3</span></header><div class=\"task\">クラウド同期</div><div class=\"task\">検索画面</div><div class=\"task\">通知設計</div></div><div class=\"board-col hot\"><header>進行中 <span>上限1</span></header><div class=\"task current\">録音→TXT保存</div></div><div class=\"board-col\"><header>完了 <span>1</span></header><div class=\"task done\">録音テスト ✓</div></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\"><b>WIP制限</b> = 同時進行を抑えて、<strong>「着手」より「完了」</strong>を増やす。</div>","layout":"","note":"","sources":["https://kanbanguides.org/ja/the-kanban-guide/"]},{"chapter":"管理と探索","short":"リーンと制約理論","title":"がんばるより、詰まりをなくす。","lead":"Lean（リーン）は無駄を減らす考え方。TOC（制約理論）は、全体を止めるボトルネックを探す考え方。","content":"\n<div class=\"pipe\"><div class=\"pipe-part\">調査 <small>早い</small></div><b>→</b><div class=\"pipe-part\">実装 <small>早い</small></div><b>→</b><div class=\"pipe-part bottleneck\">統合・確認 <small>ここが遅い</small></div><b>→</b><div class=\"pipe-part\">完成 <small>少ない</small></div></div>\n<div class=\"cols2\"><div class=\"explain-card\"><strong>リーン</strong><p>やり直し、待ち、作りすぎなど価値を生まない作業を減らす。</p></div><div class=\"explain-card fragment\" data-step=\"1\"><strong>制約理論（TOC）</strong><p>最も詰まった工程を改善し、全体の完成速度を上げる。</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"2\">AIを10体に増やしても、<strong>統合・確認が1件ずつしか進まない</strong>なら全体は速くならない。</div>","layout":"","note":"","sources":[]},{"chapter":"管理と探索","short":"まず何を確かめる？","title":"PoC・試作品・MVPは違う。","lead":"作り始める前に、何が分からないのかを分けよう。","content":"\n<div class=\"cols3\"><div class=\"explain-card \"><div class=\"piece-key\">PoC</div><strong>技術的に可能？</strong><p>例：画面を消しても録音できるか検証する。</p></div><div class=\"explain-card \"><div class=\"piece-key\">PROTOTYPE</div><strong>操作しやすい？</strong><p>例：ボタンだけの画面で使いやすさを試す。</p></div><div class=\"explain-card \"><div class=\"piece-key\">MVP</div><strong>本当に必要？</strong><p>例：最小の文字起こしアプリを使い続ける価値があるか試す。</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\"><strong>実現できること</strong>と、<strong>使う価値があること</strong>は別の問い。</div>","layout":"","note":"","sources":[]},{"chapter":"管理と探索","short":"端から端まで","title":"部品だけでは「完成」にならない。","lead":"Walking Skeletonは、最小の一連の道筋を先に通す考え方。Vertical Sliceは、利用者が使える機能を一通り作る区切り方。","content":"\n<div class=\"pathway\"><div class=\"path-node\">ボタン</div><b>→</b><div class=\"path-node\">処理</div><b>→</b><div class=\"path-node\">保存</div><b>→</b><div class=\"path-node\">結果を表示</div></div>\n<div class=\"cols2\"><div class=\"explain-card\"><strong>Walking Skeleton</strong><p>まずはダミーデータでもよいので、全体の経路を一度つなぐ。</p></div><div class=\"explain-card fragment\" data-step=\"1\"><strong>Vertical Slice</strong><p>「検索する」など1機能を、画面から結果まで完成させる。</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"2\">AIに「UIだけ」「保存処理だけ」を大量に作らせても、<strong>つながるとは限らない</strong>。</div>","layout":"","note":"","sources":[]},{"chapter":"検証と改善","short":"TDD","title":"TDD：確かめ方を先に考える。","lead":"テスト駆動開発。まず「こう動くはず」という確認を作り、それを満たすように実装します。","content":"\n<div class=\"tdd\"><div class=\"tdd-stage red\"><span>RED</span><strong>テストが失敗</strong><small>期待する動作を決める</small></div><div class=\"tdd-join\">→</div><div class=\"tdd-stage green\"><span>GREEN</span><strong>最小の実装</strong><small>テストを通す</small></div><div class=\"tdd-join\">→</div><div class=\"tdd-stage blue\"><span>REFACTOR</span><strong>整理する</strong><small>動作を変えず改善</small></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\">「正しい結果」が明確な処理に向く。<strong>美しさや映像の自然さ</strong>は別の確認も必要。</div>","layout":"","note":"","sources":[]},{"chapter":"検証と改善","short":"テストの種類","title":"小さな成功と、全体の成功は別。","lead":"テストを3つの視点で考えると、見落としに気づきやすい。","content":"\n<div class=\"test-layers\"><div class=\"test-layer l1\"><b>単体テスト</b><span>1つの処理は正しい？</span></div><div class=\"test-layer l2 fragment\" data-step=\"1\"><b>結合テスト</b><span>部品同士がつながる？</span></div><div class=\"test-layer l3 fragment\" data-step=\"2\"><b>E2Eテスト</b><span>最初から最後まで実際に使える？</span></div></div>\n<div class=\"takeaway fragment\" data-step=\"3\">自動テスト成功は強い証拠の1つ。<strong>人が触ってみる検証</strong>まで必要な場合もある。</div>","layout":"","note":"","sources":[]},{"chapter":"検証と改善","short":"仮説検証","title":"原因不明なら、実験しよう。","lead":"たくさんの設定を一度に変更すると、何が改善の原因だったか分からなくなります。","content":"\n<div class=\"hypo\"><div class=\"hypo-step\"><span>仮説</span><strong>「摩擦が強すぎる？」</strong></div><div class=\"hypo-step fragment\" data-step=\"1\"><span>実験</span><strong>摩擦だけ変える</strong></div><div class=\"hypo-step fragment\" data-step=\"2\"><span>観察</span><strong>同条件で動画を比較</strong></div><div class=\"hypo-step fragment\" data-step=\"3\"><span>判断</span><strong>改善なら採用、悪化なら戻す</strong></div></div>\n<div class=\"takeaway fragment\" data-step=\"4\">重要：<strong>改善したように見える</strong>ことと、<strong>原因が証明された</strong>ことは別。</div>","layout":"","note":"","sources":[]},{"chapter":"検証と改善","short":"仕様と記録","title":"AIに最初に渡したい3つ。","lead":"AIが意図と違う実装をするなら、AIに渡す情報を整理しよう。","content":"\n<div class=\"cols3\"><div class=\"explain-card \"><div class=\"piece-key\">SPEC</div><strong>仕様</strong><p>どんな入力・操作で、どんな結果になるべきか。</p></div><div class=\"explain-card \"><div class=\"piece-key\">CONTEXT</div><strong>背景情報</strong><p>関連するファイル・制約・過去の判断。</p></div><div class=\"explain-card \"><div class=\"piece-key\">ADR</div><strong>設計判断記録</strong><p>何を選び、なぜ別案を選ばなかったか。</p></div></div>\n<div class=\"compare mini\"><div class=\"compare-side bad\"><h3>悪い例</h3><p>「いい感じに全部直して」</p></div><div class=\"compare-side good fragment\" data-step=\"1\"><h3>良い例</h3><p>「この3秒の動作を改善。比較動画を出し、他の部分は変更しない」</p></div></div>","layout":"","note":"","sources":[]},{"chapter":"検証と改善","short":"CI/CDとGit","title":"変更するたび、安全を確かめる。","lead":"Gitは変更履歴、CIは自動検査、CDは公開可能な状態を保つ仕組み。","content":"\n<div class=\"rail \"><div class=\"rail-unit \"><div class=\"rail-num\">01</div><strong>変更する</strong><span>Gitに記録</span></div><div class=\"rail-unit \"><div class=\"rail-num\">02</div><strong>自動で検査</strong><span>CIでテスト</span></div><div class=\"rail-unit \"><div class=\"rail-num\">03</div><strong>プレビュー</strong><span>動くか確認</span></div><div class=\"rail-unit last\"><div class=\"rail-num\">04</div><strong>公開</strong><span>CDで届ける</span></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\">本番公開は「テストが通ったから何でも自動公開」ではない。<strong>安全性・公開範囲・巻き戻し</strong>も考える。</div>","layout":"","note":"","sources":[]},{"chapter":"AIと実践","short":"AIの基本ループ","title":"AIに任せるときも、小さく回す。","lead":"一度で完成させるのではなく、実際の観測結果を次の修正へ返す。","content":"\n<div class=\"agent-ring\"><div class=\"agent-center\">目的<br>達成</div><div class=\"agent-orbit\"><div class=\"orb o1\">計画</div><div class=\"orb o2\">実装</div><div class=\"orb o3\">検証</div><div class=\"orb o4\">改善</div></div></div>\n<div class=\"takeaway fragment\" data-step=\"1\"><strong>失敗しても進める</strong>ために、1回の作業範囲・止める条件・確認方法を決める。</div>","layout":"","note":"","sources":[]},{"chapter":"AIと実践","short":"マルチエージェント","title":"AIを増やす前に、役割を分ける。","lead":"調査・実装・検証を並行するときも、最後に統合する人と方法が必要です。","content":"\n<div class=\"agents\"><div class=\"agent-box\"><span>RESEARCH</span><strong>調査AI</strong><small>原因・仕様を確認</small></div><div class=\"agent-box\"><span>IMPLEMENT</span><strong>実装AI</strong><small>範囲を限定して変更</small></div><div class=\"agent-box\"><span>VERIFY</span><strong>検証AI</strong><small>独立して結果を確認</small></div></div><div class=\"integrate fragment\" data-step=\"1\">↓　<strong>統合・最終検証</strong>　↓</div><div class=\"takeaway fragment\" data-step=\"2\">同じファイルを複数AIが同時に変更すると、<strong>衝突ややり直し</strong>が起こりやすい。</div>","layout":"","note":"","sources":[]},{"chapter":"AIと実践","short":"承認の考え方","title":"何をAIに任せ、何を人が決める？","lead":"すべて人間の承認待ちにすると止まり、すべて自動化すると危険な変更を見逃します。","content":"\n<div class=\"compare\"><div class=\"compare-side good\"><h3>AIに任せやすい</h3><p>安全なテスト、ログ調査、限定した修正、レポートの整理。</p></div><div class=\"compare-side bad fragment\" data-step=\"1\"><h3>人の確認が重要</h3><p>外部公開、重要データの削除、権限変更、映像の最終的な美的判断。</p></div></div>\n<div class=\"takeaway fragment\" data-step=\"2\">承認は<strong>危険性と取り返しのつかなさ</strong>に応じて設計する。</div>","layout":"","note":"","sources":[]},{"chapter":"AIと実践","short":"AutoRigの例","title":"AutoRig：品質が答えの開発。","lead":"完成条件は「AIが修正した」ではなく、期待する映像の品質を満たすこと。","content":"\n<div class=\"case-panel\"><div class=\"case-badge\">AUTO RIG / PHYSICS</div><div class=\"case-main\">髪の破綻を直す</div><div class=\"case-sub\">基準の動画を保存 → 一要因を変更 → 同じフレームで比較 → 他区間も確認</div></div>\n<div class=\"tag-row\"><span class=\"tag \">イテレーティブ</span><span class=\"tag \">仮説検証</span><span class=\"tag \">回帰テスト</span><span class=\"tag \">美術的QA</span></div>\n<div class=\"takeaway fragment\" data-step=\"1\">数値テストが通っても、<strong>見た目が破綻していたら未完成</strong>。</div>","layout":"","note":"","sources":[]},{"chapter":"AIと実践","short":"WorkLensの例","title":"WorkLens：機能を段階的に増やす。","lead":"録音・保存・文字起こし・検索を、実際に使える単位で追加する。","content":"\n<div class=\"worklens\"><div class=\"worklens-block \" ><span>01</span><strong>録音</strong></div><div class=\"worklens-block fragment\" data-step=\"1\"><span>02</span><strong>保存</strong></div><div class=\"worklens-block fragment\" data-step=\"2\"><span>03</span><strong>文字起こし</strong></div><div class=\"worklens-block fragment\" data-step=\"3\"><span>04</span><strong>検索</strong></div></div>\n<div class=\"takeaway fragment\" data-step=\"4\">ただし、<strong>個人情報・録音への同意・認証</strong>は最初から設計する。</div>","layout":"","note":"このケースは作業順序の説明例で、端末・OS固有の制限が解消されたと主張するものではない。","sources":[]},{"chapter":"AIと実践","short":"使い分けシミュレーター","title":"いまの問題から選んでみよう。","lead":"ボタンを押すと、最初に試すべき方法と理由を表示します。","content":"\n<div class=\"chooser\"><div id=\"chooserOptions\" class=\"chooser-options\"></div><div id=\"chooserResult\" class=\"chooser-result\" aria-live=\"polite\"></div></div>","layout":"","note":"正解を断定する診断ではなく、最初の候補を出すガイドです。","sources":[]},{"chapter":"図鑑とまとめ","short":"47手法の図鑑","title":"必要なときだけ、辞典を開こう。","lead":"一度に全部を覚える必要はありません。カテゴリや検索で必要な手法を見つけてください。","content":"\n<div class=\"library-tools\"><input id=\"methodSearch\" type=\"search\" placeholder=\"例：バグ、AI、テスト、改善…\" aria-label=\"手法を検索\"><select id=\"methodCat\" aria-label=\"カテゴリ\"><option value=\"すべて\">すべての分類</option></select><span id=\"methodCount\">47件</span></div><div class=\"library-grid\" id=\"methodGrid\"></div>","layout":"library-slide","note":"このスライドは内部スクロールできます。","sources":[]},{"chapter":"図鑑とまとめ","short":"理解度クイズ","title":"説明できるか、試してみよう。","lead":"丸暗記ではなく「理由」を言えるかを確認。","content":"\n<div class=\"quiz-box\"><div class=\"quiz-step\" id=\"quizStep\"></div><h3 id=\"quizQuestion\"></h3><div id=\"quizAnswers\" class=\"quiz-answers\"></div><div id=\"quizFeedback\" class=\"quiz-feedback\" aria-live=\"polite\"></div><button class=\"solid-btn\" id=\"quizNext\" disabled>次の問題へ →</button></div>","layout":"","note":"正解・不正解どちらでも理由を確認できる。","sources":[]},{"chapter":"図鑑とまとめ","short":"AIへの指示文","title":"小さく作る指示文を使ってみよう。","lead":"作業の目標・完了条件・検証方法をAIに伝える。","content":"\n<div class=\"prompt-panel\"><div class=\"prompt-head\"><b>AIに貼り付ける指示文</b><button class=\"outline-btn\" id=\"copyPrompt\">コピー</button></div><pre id=\"promptText\"></pre></div>\n<div class=\"takeaway fragment\" data-step=\"1\">AIが「完了」と言うだけでは完了にしない。<strong>実物と検証結果</strong>を確認する。</div>","layout":"","note":"","sources":[]},{"chapter":"図鑑とまとめ","short":"まとめ","title":"手法は暗記ではなく、<em>道具</em>。","lead":"何に困っているかを見極めて、必要な方法を組み合わせよう。","content":"\n<div class=\"summary-map\"><div class=\"summary-item\"><span>新機能を増やす</span><strong>Incremental</strong></div><div class=\"summary-item\"><span>今ある機能を直す</span><strong>Iterative</strong></div><div class=\"summary-item\"><span>実現できるか不明</span><strong>PoC / Spike</strong></div><div class=\"summary-item\"><span>進行中が多すぎる</span><strong>Kanban / TOC</strong></div><div class=\"summary-item\"><span>バグが再発する</span><strong>TDD / 回帰テスト</strong></div><div class=\"summary-item\"><span>AIが意図を誤解する</span><strong>仕様・Context</strong></div></div>\n<div class=\"takeaway\">最初の一歩は、<strong>「一番小さくて、使える成果物」を作ること。</strong></div>\n<div class=\"reference-line\"><a href=\"https://agilealliance.org/agile101/agile-glossary/\" target=\"_blank\" rel=\"noopener noreferrer\">Agile Alliance</a><a href=\"https://scrumguides.org/scrum-guide.html\" target=\"_blank\" rel=\"noopener noreferrer\">Scrum Guide</a><a href=\"https://kanbanguides.org/ja/the-kanban-guide/\" target=\"_blank\" rel=\"noopener noreferrer\">Kanban Guide</a><a href=\"https://note.com/simplearchitect/n/n8339c9eac8cb\" target=\"_blank\" rel=\"noopener noreferrer\">牛尾剛さんの記事</a><a href=\"https://developer.mozilla.org/en-US/docs/Web/API/Web_Animations_API\" target=\"_blank\" rel=\"noopener noreferrer\">MDN Web Animations</a></div>","layout":"","note":"","sources":[]}], methods=[["iterative","イテレーティブ","Iterative","進め方","最初に","同じ機能を何度も良くする","試作品→見て確かめる→直す。新機能より既存機能の改善に重点。","正解がまだ分からないとき","学びながら品質を上げられる","完成条件がないと延々と修正","AutoRigの髪の動きを短い動画で確認して直す","https://agilealliance.org/glossary/iterative-development/"],["incremental","インクリメンタル","Incremental","進め方","最初に","使える機能を少しずつ増やす","1つ動くものを完成させ、次の機能を追加。途中の版も使えることが大切。","機能を段階的に増やしたいとき","途中でも使える成果物が残る","あとから機能を足しにくい設計だと困る","WorkLensの録音→保存→文字起こし→検索","https://agilealliance.org/glossary/incremental-development/"],["agile","アジャイル","Agile","進め方","最初に","動く成果物と変化への対応を重視","手順の名前ではなく価値観。動かして学び、優先順位を見直す。","途中で要望や状況が変わるとき","学びを計画へ反映できる","「計画不要」と誤解すると混乱","実機テスト結果でWorkLensの開発順を変える","https://agilemanifesto.org/iso/ja/manifesto.html"],["waterfall","ウォーターフォール","Waterfall","進め方","次に","工程を大きく区切って順番に進める","要件→設計→実装→テスト→公開。工程ごとの合意を重視する。","仕様が安定・手続きが厳格なとき","全体計画と責任範囲が明確","後半の仕様変更で手戻りが増えやすい","外部規格が固定された受託開発","https://www.atlassian.com/agile/project-management/waterfall-methodology"],["v-model","V字モデル","V-Model","進め方","その後","設計と検証を対応させる","要件には受入試験、設計には統合試験、部品には単体試験を対応。","検証漏れを減らしたいとき","どのテストが何を保証するか明確","仕様が揺れると管理が重くなる","音声保存の要件と受入テストを対応づける","https://glossary.istqb.org/ja_JP/term/vv-model"],["spiral","スパイラルモデル","Spiral Model","進め方","その後","大きなリスクを一周ずつ潰す","リスク分析→試作→評価→次の計画を周回する。","不確実で失敗コストが高いとき","危険な前提を先に検証","リスク管理の負荷がある","端末によって録音制限が違う場合の検証","https://www.sei.cmu.edu/"],["scrum","スクラム","Scrum","管理","次に","短い期間ごとに目標と成果を確認","正式には責任・イベント・作成物が定義されたチーム向けフレームワーク。","チームで仕事を回したいとき","目標とフィードバックを共有","1人開発では形式が過剰なことも","週ごとに実機で通す目標を決める（参考運用）","https://scrumguides.org/scrum-guide.html"],["kanban","カンバン","Kanban","管理","最初に","仕事の流れを見える化する","未着手→進行中→検証→完了。途中の作業（WIP）を増やしすぎない。","同時進行が多く停滞するとき","どこで詰まっているか見える","カード整理だけで満足しがち","AutoRigのMaya Writerを重複稼働させない","https://kanbanguides.org/ja/the-kanban-guide/"],["lean","リーン","Lean","管理","次に","価値を生まない作業を減らす","待ち・やり直し・作りすぎを減らし、必要な成果に集中する。","作業量だけ増えて成果が少ないとき","無駄を発見しやすい","必要な実験や安全余裕まで削ると失敗","レポートの枚数より合格した動画を重視","https://www.lean.org/explore-lean/"],["prototype","プロトタイピング","Prototyping","探索","最初に","試作品で確かめる","本番前に小さな見本を作り、使い心地や技術を確かめる。","形が想像しにくいとき","誤解を早く見つける","試作品を本番品質と勘違いしやすい","ダミーの学習アプリ画面を先に触ってみる","https://www.interaction-design.org/literature/topics/prototyping"],["poc","PoC・概念実証","Proof of Concept","探索","最初に","そもそも作れるかを確かめる","1つの技術的な疑問に絞って実験する。","実現可能性に不安があるとき","不可能な計画を早く見直せる","ユーザー価値までは証明できない","Androidの画面オフ録音が可能か検証","https://aws.amazon.com/what-is/proof-of-concept/"],["mvp","MVP","Minimum Viable Product","探索","次に","最小の製品で価値を確かめる","ユーザーに使ってもらい、必要性や価値を学べる最小の製品。","需要が分からないとき","作りすぎを防げる","粗すぎると価値を検証できない","文字起こしだけを日常で使ってみる","https://www.productplan.com/glossary/minimum-viable-product/"],["spike","スパイク","Spike","探索","次に","時間を区切った調査・実験","分からない技術を調べて、小さな決定を可能にする。  const s=scenarios[chooserIndex];res.innerHTML='<div class="eyebrow">最初に試す候補</div><h3>'+esc(s[0])+'</h3><div class="tag-row">'+s[1].map(x=>'<span class="tag">'+esc(x)+'</span>').join("")+'</div><p>'+esc(s[2])+'</p><ol><li>確認したいことを1つ書く</li><li>最小のテスト・成果物を作る</li><li>実際の結果で判断する</li></ol>';
}
function renderMethods(){
 const input=$("methodSearch"),select=$("methodCat"),grid=$("methodGrid");if(!grid)return;
 if(!select.options.length||select.options.length===1){[...new Set(methods.map(m=>m[3]))].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;select.appendChild(o)});}
 const s=(input.value||"").trim().toLowerCase(),cat=select.value;const list=methods.filter(m=>(cat==="すべて"||m[3]===cat)&&m.slice(1).join(" ").toLowerCase().includes(s));
 $("methodCount").textContent=list.length+" / "+methods.length+"件";
 grid.innerHTML=list.map(m=>'<article class="library-item"><span class="method-tag">'+esc(m[3])+'</span><strong>'+esc(m[1])+'</strong><p>'+esc(m[5])+'</p><details><summary>もっと見る</summary><div class="library-detail"><p>'+esc(m[6])+'</p><p><b>向く：</b>'+esc(m[7])+'</p><p><b>弱点：</b>'+esc(m[9])+'</p><p><b>例：</b>'+esc(m[10])+'</p><a target="_blank" rel="noopener noreferrer" href="'+esc(m[11])+'">参考資料を読む ↗</a></div></details></article>').join("")||'<p>一致する手法がありません。</p>';
}
function renderQuiz(){
 const box=$("quizAnswers");if(!box)return;
 quizAnswered=false;const q=quiz[quizIndex];$("quizStep").textContent="QUESTION "+(quizIndex+1)+" / "+quiz.length;$("quizQuestion").textContent=q[0];
 box.innerHTML=q[1].map((x,i)=>'<button type="button" data-answer="'+i+'">'+esc(x)+'</button>').join("");$("quizFeedback").textContent="まず自分で予想して、選んでみよう。";$("quizNext").disabled=true;$("quizNext").textContent=quizIndex===quiz.length-1?"もう一度 ↻":"次の問題へ →";
}
function answer(i){
 if(quizAnswered)return;quizAnswered=true;const q=quiz[quizIndex];
 $("quizAnswers").querySelectorAll("button").forEach(b=>{const idx=Number(b.dataset.answer);if(idx===q[2])b.classList.add("correct");if(idx===i&&idx!==q[2])b.classList.add("wrong");b.disabled=true;});
 $("quizFeedback").textContent=(i===q[2]?"正解。 ":"確認しよう。 ")+q[3];$("quizNext").disabled=false;
}
async function copy(){
 const btn=$("copyPrompt"),text=$("promptText").textContent;let ok=false;
 try{await navigator.clipboard.writeText(text);ok=true}catch(e){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{ok=document.execCommand("copy")}catch(e2){}t.remove();}
 btn.textContent=ok?"コピーしました":"コピー不可";setTimeout(()=>btn.textContent="コピー",1800);
}
function toggleMotion(){motionOff=!motionOff;document.body.classList.toggle("no-motion",motionOff);$("motionBtn").textContent=motionOff?"動き：オフ":"動き：オン";}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}}
let startX=0,startY=0;
document.addEventListener("touchstart",e=>{if(e.touches.length!==1)return;startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(!$("overview").classList.contains("open")&&e.changedTouches.length===1){const x=e.changedTouches[0].clientX-startX,y=e.changedTouches[0].clientY-startY;if(Math.abs(x)>70&&Math.abs(x)>Math.abs(y)*1.6){if(x<0)next();else previous();}}},{passive:true});
document.addEventListener("keydown",e=>{
 const active=document.activeElement;const editing=active&&["INPUT","SELECT","TEXTAREA"].includes(active.tagName);
 if(e.key==="Escape"&&$("overview").classList.contains("open")){toggleOverview(false);e.preventDefault();return;}
 if(editing||e.altKey||e.ctrlKey||e.metaKey)return;
 if($("overview").classList.contains("open"))return;
 if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();next();}
 else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();previous();}
 else if(e.key==="Home"){e.preventDefault();go(0)}
 else if(e.key==="End"){e.preventDefault();go(slides.length-1)}
 else if(e.key.toLowerCase()==="o"){e.preventDefault();toggleOverview(true)}
 else if(e.key.toLowerCase()==="f"){e.preventDefault();full()}
});
document.addEventListener("click",e=>{
 const jump=e.target.closest("[data-jump]");if(jump){go(Number(jump.dataset.jump));return;}
 const sec=e.target.closest("[data-section]");if(sec){const i=slides.findIndex(s=>s.chapter===sec.dataset.section);if(i>=0)go(i);return;}
 const choice=e.target.closest("[data-choice]");if(choice){chooserIndex=Number(choice.dataset.choice);renderChooser();return;}
 const ans=e.target.closest("[data-answer]");if(ans){answer(Number(ans.dataset.answer));return;}
});
$("next").addEventListener("click",next);$("prev").addEventListener("click",previous);
$("outlineBtn").addEventListener("click",()=>toggleOverview(true));$("outlineClose").addEventListener("click",()=>toggleOverview(false));
$("overview").addEventListener("click",e=>{if(e.target===$("overview"))toggleOverview(false)});
$("motionBtn").addEventListener("click",toggleMotion);$("fullBtn").addEventListener("click",full);
document.addEventListener("input",e=>{if(e.target.id==="methodSearch")renderMethods();});document.addEventListener("change",e=>{if(e.target.id==="methodCat")renderMethods();});
document.addEventListener("click",e=>{if(e.target.id==="quizNext"){quizIndex=(quizIndex+1)%quiz.length;renderQuiz()}if(e.target.id==="copyPrompt")copy()});
build();motionOff=!!prefersReduced;document.body.classList.toggle("no-motion",motionOff);$("motionBtn").textContent=motionOff?"動き：オフ":"動き：オン";
const hash=Number(location.hash.replace("#",""));go(Number.isFinite(hash)&&hash>=1&&hash<=slides.length?hash-1:0);
</script></body></html>
